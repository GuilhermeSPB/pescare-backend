name: Backend CI

on:
  push:
    branches: [dev, main]

  pull_request:
    branches: [dev, main]

jobs:
  validate:
    name: Validate Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://user:password@localhost:5432/pescare?schema=public"
        
      - name: Build backend
        run: npm run build
